name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The toolchain build is the whole cost model here. Cold it is two LLVM builds,
# native then cross-compiled to wasm — hours on a runner. Warm it is `ninja` on
# one source file and a link, which is seconds. So everything hangs on the
# caching, and it is arranged around two facts learned the hard way:
#
#   * A cold bootstrap does not fit in one run. It is therefore four steps with
#     four caches, saved as each finishes, so a run that runs out of time banks
#     what it did and the next one carries on. `bootstrap.sh <step>` exists for
#     this.
#   * A build whose value is the cache must not be cancelled. cancel-in-progress
#     threw away two hours of LLVM because a later push wanted a turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned inputs
        id: meta
        run: |
          # config.sh is the single source of truth; parse it rather than
          # repeating the values here, where they would drift.
          set -a; source scripts/config.sh; set +a
          echo "llvm_tag=$LLVM_TAG" >> "$GITHUB_OUTPUT"
          echo "emsdk=$EMSDK_VERSION" >> "$GITHUB_OUTPUT"
          hash="$(printf '%s' "$CMAKE_COMMON" | sha256sum | cut -c1-16)"
          echo "cmake_hash=$hash" >> "$GITHUB_OUTPUT"
          echo "native_key=llvm-native-${{ runner.os }}-$LLVM_TAG-$hash" >> "$GITHUB_OUTPUT"
          echo "wasm_key=llvm-wasm-${{ runner.os }}-$LLVM_TAG-$EMSDK_VERSION-$hash" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./js/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        # The cross build needs ~40 GB and a stock runner ships with far less
        # free; these are the largest things no LLVM build touches.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake rsync

      # restore/save rather than actions/cache, deliberately. actions/cache
      # skips its save step when the job fails — sensible for a cheap cache,
      # ruinous for this one: hours of LLVM thrown away because a later step
      # that takes seconds returned non-zero. Each stage is correct or not on
      # its own terms, so it is saved the moment it is built and never again
      # depends on what happens after.
      - name: Restore the LLVM source
        id: src
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/clang-abi-wasm/llvm-project
          key: llvm-src-${{ steps.meta.outputs.llvm_tag }}
      - if: steps.src.outputs.cache-hit != 'true'
        run: scripts/bootstrap.sh source
      - if: steps.src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/clang-abi-wasm/llvm-project
          key: llvm-src-${{ steps.meta.outputs.llvm_tag }}

      - name: Restore the native LLVM
        id: native
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/clang-abi-wasm/build-native
          key: ${{ steps.meta.outputs.native_key }}
      - if: steps.native.outputs.cache-hit != 'true'
        run: scripts/bootstrap.sh native
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/clang-abi-wasm/build-native
          key: ${{ steps.meta.outputs.native_key }}

      - name: Restore the Emscripten SDK
        id: emsdk
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/clang-abi-wasm/emsdk
          key: emsdk-${{ steps.meta.outputs.emsdk }}
      - if: steps.emsdk.outputs.cache-hit != 'true'
        run: scripts/bootstrap.sh emsdk
      - if: steps.emsdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/clang-abi-wasm/emsdk
          key: emsdk-${{ steps.meta.outputs.emsdk }}

      - name: Restore the wasm LLVM
        id: wasm
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/clang-abi-wasm/build-wasm
          key: ${{ steps.meta.outputs.wasm_key }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: scripts/bootstrap.sh wasm
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/clang-abi-wasm/build-wasm
          key: ${{ steps.meta.outputs.wasm_key }}

      # The stamps live beside the trees and are not part of any cache, so
      # bootstrap.sh has to be told what a restore already provided.
      - name: Mark the restored stages as current
        run: scripts/bootstrap.sh --stamp-only

      - name: Build the module
        run: scripts/build.sh wasm

      - name: Conformance
        run: node test/conformance.mjs

      - name: Package the release
        run: scripts/package-release.sh

      - name: Report
        run: |
          {
            echo '### clang-abi-wasm'
            echo
            node -e '
              const m = require("./release/manifest.json");
              console.log("| file | size | gzip |");
              console.log("|---|---:|---:|");
              const mb = (n) => (n / 1048576).toFixed(1) + " MB";
              for (const [k, f] of Object.entries(m.files))
                console.log(`| ${k} | ${mb(f.bytes)} | ${mb(f.gzip)} |`);
              const total = Object.values(m.files).reduce((a, f) => a + f.gzip, 0);
              console.log(`| **over the wire** | | **${mb(total)}** |`);
              console.log();
              console.log(`clang ${m.clang}, emsdk ${m.inputs.emsdk}`);
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: clang-abi-wasm-${{ steps.meta.outputs.version }}
          path: release/
          retention-days: 30

  # A tag publishes what the build job already produced and tested. Nothing is
  # rebuilt here: the artifact that passed conformance is the artifact released.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: clang-abi-wasm-${{ needs.build.outputs.version }}
          path: release

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="${{ needs.build.outputs.version }}"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match js/package.json version $pkg" >&2
            exit 1
          fi

      - name: Release notes
        run: |
          node -e '
            const m = require("./release/manifest.json");
            const mb = (n) => (n / 1048576).toFixed(1) + " MB";
            const total = Object.values(m.files).reduce((a, f) => a + f.gzip, 0);
            console.log(`Built from clang ${m.clang} (${m.inputs.llvmTag}), emsdk ${m.inputs.emsdk}.`);
            console.log();
            console.log("| file | size | gzip |");
            console.log("|---|---:|---:|");
            for (const [k, f] of Object.entries(m.files))
              console.log(`| \`${f.path}\` | ${mb(f.bytes)} | ${mb(f.gzip)} |`);
            console.log(`| **total** | | **${mb(total)}** |`);
            console.log();
            console.log("Every file but `manifest.json` is content-addressed and safe to serve immutable.");
            console.log();
            console.log("```js");
            console.log("import { load } from \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/index.mjs\";");
            console.log("const abi = await load({ baseUrl: \"…/releases/download/${{ github.ref_name }}/\" });");
            console.log("```");
          ' > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: NOTES.md
          fail_on_unmatched_files: true
